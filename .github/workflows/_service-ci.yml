name: Reusable service CI/CD
#   dev   branch  ->  test -> CodeQL -> build -> Trivy scan -> PUSH to ECR   (NO deploy)
#   main  branch  ->  test -> CodeQL -> build -> Trivy scan -> PUSH to ECR -> DEPLOY to EKS, gated by the `prod` environment (manual approval)
on:
  workflow_call:
    inputs:
      service:
        description: "Service name (web|api)."
        required: true
        type: string

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
  NAMESPACE: ${{ vars.NAMESPACE }}

jobs:
  # quality:
  #   name: Unit tests & SCA
  #   runs-on: [self-hosted, linux, app]
  #   steps:
  #     - uses: actions/checkout@v5
      
  #     - uses: ./.github/actions/node-quality
  #       with:
  #         working-directory: ${{ inputs.service }}
  #         node-version: "26.3"

  # codeql:
  #   name: CodeQL (SAST)
  #   runs-on: [self-hosted, linux, app]
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: github/codeql-action/init@v4
  #       with:
  #         languages: javascript
  #     - uses: github/codeql-action/analyze@v4
  #       with:
  #         category: "/language:javascript-${{ inputs.service }}"

  # Build, scan, push — on BOTH dev and main.
  build-push:
    name: Build, scan & push (ECR)
    # needs: [quality, codeql]
    runs-on: [self-hosted, linux, app]
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Build image metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            CHANNEL=prod
          else
            CHANNEL=dev
          fi

          echo "image_tag=${SHORT_SHA}-${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: ECR login
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "image=$REGISTRY/${ECR_NAMESPACE}/${{ inputs.service }}" >> "$GITHUB_OUTPUT"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build, scan & push image
        uses: ./.github/actions/docker-build-scan-push
        with:
          context: ${{ inputs.service }}
          image: ${{ steps.ecr.outputs.image }}
          tag: ${{ steps.meta.outputs.image_tag }}
          severity: "LOW"

  # Deploy ONLY on main, behind the gated `prod` environment (manual approval).
  deploy:
    name: Deploy to EKS (gated)
    needs: build-push
    # if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, app]
    environment: prod
    concurrency:
      group: deploy-${{ inputs.service }}-prod
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Helm lint
        run: |
          helm lint ./helm/${{ inputs.service }}
      
      - name: Helm Template Validation
        run: |
          helm template \
            ${{ inputs.service }} \
            ./helm/${{ inputs.service }} \
            >/dev/null

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
      
      - name: Build Image URI
        id: image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "repository=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_NAMESPACE}/${{ inputs.service }}" \
            >> "$GITHUB_OUTPUT"

      - name: Debug Deployment Values
        run: |
          echo "Repository: ${{ steps.image.outputs.repository }}"
          echo "Tag: ${{ needs.build-push.outputs.image_tag }}"
              
      - name: Helm Upgrade
        run: |
          helm upgrade --install ${{ inputs.service }} ./helm/${{ inputs.service }} \
            --namespace ${{ vars.NAMESPACE }} \
            --set image.repository="${{ steps.image.outputs.repository }}" \
            --set image.tag="${{ needs.build-push.outputs.image_tag }}" \
            --set-string ingress.annotations.alb\\.ingress\\.kubernetes\\.io/certificate-arn="${{ secrets.ACM_CERT_ARN }}" \
            --wait \
            --timeout 5m
      - name: Verify Rollout
        run: |
          kubectl -n ${{ vars.NAMESPACE }} rollout status \
            deployment/${{ inputs.service }} \
            --timeout=180s
