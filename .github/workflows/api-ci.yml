name: api CI/CD

# Runs only when the api tier (or shared pipeline code) changes.
on:
  push:
    # branches: [main, develop]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/_service-ci.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  api:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: api
    secrets: inherit
