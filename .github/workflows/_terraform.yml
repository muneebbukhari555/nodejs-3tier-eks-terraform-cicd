name: Reusable Terraform

on:
  workflow_call:
    inputs:
      action: { description: "plan or apply", required: true, type: string }
      environment: { description: "GitHub Environment (plan | prod)", required: true, type: string }
      targets: { description: "Optional space-separated -target list", required: false, type: string, default: "" }

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_S3_BUCKET: ${{ vars.TF_STATE_S3_BUCKET }}
  TF_State_File_Key: ${{ vars.TF_State_File_Key }}
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: [self-hosted, linux, infra]
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Build -target args
        id: tgt
        run: |
          ARGS=""
          for t in ${{ inputs.targets }}; do ARGS="$ARGS -target=$t"; done
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: Debug
        run: |
          node -v
          which terraform
          ls -l $(which terraform)
          terraform version
      - run: terraform fmt -check -recursive .
      - run: terraform init
      - name: Terraform init
        id: init
        run: |
          terraform init \
            -backend-config="region=${{env.AWS_REGION}}" \
            -backend-config="bucket=${{env.TF_STATE_S3_BUCKET}}" \
            -backend-config="key=${{env.TF_State_File_Key}}"
            -backend-config="use_lockfile=true"
            -backend-config="encrypt=true"

      - run: terraform validate

      - name: Plan
        id: plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -var-file=environments/prod/prod.tfvars ${{ steps.tgt.outputs.args }} -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -var-file=environments/prod/prod.tfvars ${{ steps.tgt.outputs.args }}
