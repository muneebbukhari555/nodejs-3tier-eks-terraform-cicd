name: web CI/CD

## Runs only when the web tier (or shared pipeline code) changes.
on:
  push:
    # branches: [main, develop]
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  
jobs:
  web:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: web
    secrets: inherit
