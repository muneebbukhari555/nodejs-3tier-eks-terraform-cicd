name: web CI/CD

# Runs only when the web tier (or shared pipeline code) changes.
on:
  push:
    # branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/_service-ci.yml"
      - ".github/actions/**"
  workflow_dispatch:

jobs:
  web:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: web
