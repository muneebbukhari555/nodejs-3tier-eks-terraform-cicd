services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"                 # exposed so you can inspect with psql / a GUI
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      PORT: "3000"
      DB: appdb
      DBUSER: appuser
      DBPASS: appsecret
      DBHOST: db                    
      DBPORT: "5432"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: ./web
    environment:
      PORT: "3000"
      
      API_HOST: "http://api:3000"
    ports:
      - "8080:3000"
    depends_on:
      api:
        condition: service_healthy 

volumes:
  db-data:
