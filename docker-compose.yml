# Local dev stack for the 3-tier app: web -> api -> postgres
# Mirrors the Kubernetes topology so you can see the full flow before deploying to EKS.
#
#   web (UI, Jade)      :8080 -> container :3000   calls API_HOST
#   api (Express + pg)  :3000 -> container :3000   queries Postgres
#   db  (Postgres 15)   :5432                        the database tier
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080      (web UI)
#   curl http://localhost:3000/api/status   (api -> db round trip)
#
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"                 # exposed so you can inspect with psql / a GUI
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      PORT: "3000"
      # These names match what api/app.js reads (and the k8s db-credentials Secret).
      DB: appdb
      DBUSER: appuser
      DBPASS: appsecret
      DBHOST: db                    # service name on the compose network
      DBPORT: "5432"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Mirrors the Dockerfile HEALTHCHECK so compose knows when the api is truly ready.
      # web.depends_on uses condition: service_healthy — without this, web starts before
      # the api binds and the first request to API_HOST gets ECONNREFUSED.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: ./web
    environment:
      PORT: "3000"
      # In k8s this is the in-cluster Service DNS; here it's the api compose service.
      API_HOST: "http://api:3000"
    ports:
      - "8080:3000"
    depends_on:
      api:
        condition: service_healthy  # waits until api /api/status returns 200

volumes:
  db-data:
