apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-externalsecret
spec:
  refreshInterval: {{ .Values.secretRef.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretRef.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: {{ .Values.secretRef.secretName }}
